<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d111a">
<title>XXUUS OS — macOS 27 Web</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='1' stop-color='%23e2e8f0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='url(%23g)' stroke='%23cbd5e1' stroke-width='1.5'/%3E%3Cpath fill='%23000000' transform='translate(11,10) scale(0.42)' d='M50 34C55 34 60 29 67 29C74 29 80 33 83 39C73 43 70 48 70 54C70 61 76 66 84 69C81 79 74 92 65 92C58 92 55 89 50 89C45 89 42 92 35 92C25 92 16 74 16 54C16 37 25 29 34 29C41 29 45 34 50 34ZM50 27C50 17 57 9 67 8C67 18 60 26 50 27Z'/%3E%3C/svg%3E">
<style>
:root{
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.22);
  --accent-ring:rgba(10,132,255,.45);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius-win:14px;
  --menubar-h:28px;
}

html[data-accent="blue"]{--accent:#0a84ff;--accent-soft:rgba(10,132,255,.22);--accent-ring:rgba(10,132,255,.45)}
html[data-accent="purple"]{--accent:#bf5af2;--accent-soft:rgba(191,90,242,.22);--accent-ring:rgba(191,90,242,.45)}
html[data-accent="pink"]{--accent:#ff375f;--accent-soft:rgba(255,55,95,.22);--accent-ring:rgba(255,55,95,.45)}
html[data-accent="orange"]{--accent:#ff9f0a;--accent-soft:rgba(255,159,10,.22);--accent-ring:rgba(255,159,10,.45)}
html[data-accent="green"]{--accent:#30d158;--accent-soft:rgba(48,209,88,.22);--accent-ring:rgba(48,209,88,.45)}

html[data-theme="dark"]{
  --text:#f5f5f7;
  --text-2:rgba(245,245,247,.72);
  --text-3:rgba(245,245,247,.46);
  --menubar-bg:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));
  --menubar-border:rgba(255,255,255,.22);
  --menubar-text:#f5f5f7;
  --win-bg:rgba(28,31,40,.54);
  --win-body:rgba(20,22,30,.52);
  --sidebar-bg:rgba(255,255,255,.06);
  --toolbar-bg:rgba(255,255,255,.07);
  --card-bg:rgba(255,255,255,.08);
  --card-hover:rgba(255,255,255,.14);
  --border-outer:rgba(0,0,0,.42);
  --border-inner:rgba(255,255,255,.32);
  --hairline:rgba(255,255,255,.12);
  --dock-bg:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.08) 54%,rgba(255,255,255,.14) 100%);
  --dock-border:rgba(255,255,255,.38);
  --popover-bg:rgba(30,33,44,.64);
  --input-bg:rgba(0,0,0,.24);
  --shadow-active:0 28px 80px rgba(0,0,0,.52),0 8px 24px rgba(0,0,0,.32);
  --shadow-inactive:0 14px 40px rgba(0,0,0,.28);
}

html[data-theme="light"]{
  --text:#1d1d1f;
  --text-2:rgba(29,29,31,.68);
  --text-3:rgba(29,29,31,.45);
  --menubar-bg:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.32));
  --menubar-border:rgba(255,255,255,.65);
  --menubar-text:#1d1d1f;
  --win-bg:rgba(255,255,255,.62);
  --win-body:rgba(255,255,255,.56);
  --sidebar-bg:rgba(255,255,255,.32);
  --toolbar-bg:rgba(255,255,255,.38);
  --card-bg:rgba(255,255,255,.42);
  --card-hover:rgba(255,255,255,.62);
  --border-outer:rgba(0,0,0,.14);
  --border-inner:rgba(255,255,255,.85);
  --hairline:rgba(0,0,0,.09);
  --dock-bg:linear-gradient(180deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.26) 55%,rgba(255,255,255,.44) 100%);
  --dock-border:rgba(255,255,255,.80);
  --popover-bg:rgba(255,255,255,.68);
  --input-bg:rgba(0,0,0,.055);
  --shadow-active:0 26px 70px rgba(0,0,0,.20),0 6px 20px rgba(0,0,0,.10);
  --shadow-inactive:0 12px 32px rgba(0,0,0,.10);
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--text);background:#0c0f17;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:default}

/* ========== WALLPAPER & DESKTOP ========== */
#desktop{position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate}
#wallpaper{position:absolute;inset:-20px;z-index:-2;transition:transform .58s cubic-bezier(.22,1,.36,1),filter .5s ease,opacity .45s ease;background-size:cover;background-position:center}
#wallpaper-canvas{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.85;transition:transform .58s cubic-bezier(.22,1,.36,1)}
#wallpaper-svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;transition:transform .58s cubic-bezier(.22,1,.36,1)}
#menubar,#desktop-icons,#windows,#dock-container{transition:opacity .4s cubic-bezier(.22,1,.36,1),transform .48s cubic-bezier(.22,1,.36,1)}
body.is-locked #menubar,
body.is-locked #desktop-icons,
body.is-locked #windows,
body.is-locked #dock-container{opacity:0;transform:scale(.945);pointer-events:none}
body.is-locked #wallpaper,
body.is-locked #wallpaper-svg,
body.is-locked #wallpaper-canvas{transform:scale(1.04)}

#selection-box{
  position:absolute;z-index:5;display:none;pointer-events:none;
  background:rgba(10,132,255,.18);border:1px solid rgba(10,132,255,.7);border-radius:3px;
}

/* ========== BOOT SCREEN ========== */
#boot{
  position:fixed;inset:0;z-index:99999;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1),visibility .65s ease;
}
#boot.done{opacity:0;transform:scale(1.04);visibility:hidden;pointer-events:none}
.boot-bar{width:190px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.boot-fill{height:100%;width:0%;background:#fff;border-radius:99px;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.boot-skip{position:absolute;bottom:28px;font-size:12px;color:rgba(255,255,255,.45);background:transparent;border:0;cursor:pointer}
.boot-skip:hover{color:rgba(255,255,255,.8)}

/* ========== MENU BAR (LIQUID GLASS) ========== */
#menubar{
  position:absolute;top:0;left:0;right:0;height:var(--menubar-h);z-index:10000;
  display:flex;align-items:center;padding:0 10px;
  background:var(--menubar-bg);
  backdrop-filter:blur(24px) saturate(210%) brightness(1.06);-webkit-backdrop-filter:blur(24px) saturate(210%) brightness(1.06);
  border-bottom:1px solid var(--menubar-border);
  box-shadow:inset 0 -0.5px 0 rgba(255,255,255,.2),0 2px 12px rgba(0,0,0,.08);
  color:var(--menubar-text);font-size:13px;font-weight:500;
}
.mb-left,.mb-right{display:flex;align-items:center;height:100%}
.mb-right{margin-left:auto;gap:3px}
.mb-item{
  height:22px;padding:0 9px;border-radius:6px;border:0;background:transparent;
  display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap;
  transition:background .12s;
}
.mb-item:hover,.mb-item.open{background:rgba(255,255,255,.2)}
.mb-appname{font-weight:700;padding:0 10px}
.mb-icon-btn{padding:0 7px}
#mb-clock{font-variant-numeric:tabular-nums;font-size:12.5px;padding:0 8px}
#mb-music-pill{
  height:21px;padding:0 9px;border-radius:99px;border:1px solid var(--dock-border);
  background:rgba(255,255,255,.14);backdrop-filter:blur(14px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;max-width:210px;cursor:pointer;
  transition:background .15s,transform .12s;margin-right:4px;
}
#mb-music-pill:hover{background:rgba(255,255,255,.24)}
#mb-music-pill .pill-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mb-music-pill .pill-dot{width:6px;height:6px;border-radius:50%;background:#ff375f;flex:none}
#mb-music-pill.playing .pill-dot{background:#30d158;box-shadow:0 0 8px #30d158;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.75)}}

/* ========== DROPDOWN MENUS & POPOVERS ========== */
.mac-menu{
  position:absolute;z-index:30000;min-width:210px;padding:5px;
  border-radius:10px;background:var(--popover-bg);
  backdrop-filter:blur(42px) saturate(190%);-webkit-backdrop-filter:blur(42px) saturate(190%);
  border:1px solid var(--border-inner);
  box-shadow:0 16px 46px rgba(0,0,0,.38),0 0 0 .5px var(--border-outer);
  display:none;flex-direction:column;gap:1px;
  animation:popIn .12s cubic-bezier(.2,.8,.2,1);
}
.mac-menu.show{display:flex}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(-3px)}to{opacity:1;transform:none}}
.mac-menu-btn{
  border:0;background:transparent;border-radius:6px;padding:5px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  font-size:13px;text-align:left;width:100%;
}
.mac-menu-btn:hover{background:var(--accent);color:#fff}
.mac-menu-btn:hover .kbd{color:rgba(255,255,255,.85)}
.mac-menu-btn .kbd{font-size:11.5px;color:var(--text-3);font-family:var(--font)}
.mac-sep{height:1px;background:var(--hairline);margin:4px 8px}

/* Control Center (Liquid Glass) */
#control-center{
  position:absolute;top:34px;right:10px;z-index:29000;width:320px;padding:12px;
  border-radius:18px;background:var(--popover-bg);
  backdrop-filter:blur(28px) saturate(215%) brightness(1.06);-webkit-backdrop-filter:blur(28px) saturate(215%) brightness(1.06);
  border:1px solid var(--border-inner);
  box-shadow:0 22px 58px rgba(0,0,0,.44),inset 0 1px 1px rgba(255,255,255,.45),0 0 0 .5px var(--border-outer);
  display:none;flex-direction:column;gap:10px;
  animation:popIn .14s cubic-bezier(.2,.8,.2,1);
}
#control-center.show{display:flex}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-card{
  background:var(--card-bg);border:1px solid var(--hairline);border-radius:13px;
  padding:10px;display:flex;flex-direction:column;gap:8px;
}
.cc-row{display:flex;align-items:center;gap:9px;cursor:pointer;padding:2px;border-radius:8px}
.cc-circle{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:rgba(128,128,128,.25);color:var(--text);flex:none;transition:background .15s;
}
.cc-circle.on{background:var(--accent);color:#fff}
.cc-label{font-size:12px;font-weight:600;line-height:1.2}
.cc-sub{font-size:10.5px;color:var(--text-2);font-weight:400}
.cc-tile-btn{
  border:1px solid var(--hairline);background:var(--card-bg);border-radius:13px;
  padding:10px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;
  transition:background .15s;
}
.cc-tile-btn:hover{background:var(--card-hover)}
.cc-slider-wrap{display:flex;align-items:center;gap:8px}
.cc-slider{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
  background:rgba(128,128,128,.3);outline:none;cursor:pointer;
}
.cc-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 5px rgba(0,0,0,.35);
}

/* Notification / Date Widget (Liquid Glass) */
#notif-center{
  position:absolute;top:34px;right:10px;z-index:29000;width:300px;padding:14px;
  border-radius:18px;background:var(--popover-bg);
  backdrop-filter:blur(28px) saturate(215%) brightness(1.06);-webkit-backdrop-filter:blur(28px) saturate(215%) brightness(1.06);
  border:1px solid var(--border-inner);box-shadow:0 22px 58px rgba(0,0,0,.44),inset 0 1px 1px rgba(255,255,255,.45);
  display:none;flex-direction:column;gap:12px;animation:popIn .14s ease;
}
#notif-center.show{display:flex}

/* ========== DESKTOP ICONS ========== */
#desktop-icons{position:absolute;inset:calc(var(--menubar-h) + 12px) 12px 92px 12px;z-index:2;pointer-events:none}
.desk-item{
  position:absolute;width:82px;padding:6px 4px;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  pointer-events:auto;border:1px solid transparent;background:transparent;
  cursor:default;transition:background .12s;
}
.desk-item .icon-box{width:54px;height:54px;display:grid;place-items:center;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35))}
.desk-item .desk-label{
  font-size:11.5px;font-weight:500;color:#fff;text-align:center;line-height:1.25;
  padding:2px 6px;border-radius:4px;text-shadow:0 1px 3px rgba(0,0,0,.85);
  word-break:break-word;
}
.desk-item.selected .icon-box{background:rgba(255,255,255,.16);border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.desk-item.selected .desk-label{background:var(--accent);text-shadow:none}

/* ========== DOCK (APPLE LIQUID GLASS) ========== */
#dock-container{
  position:absolute;left:0;right:0;bottom:10px;z-index:9500;
  display:flex;justify-content:center;pointer-events:none;
}
#dock{
  pointer-events:auto;position:relative;
  display:flex;align-items:flex-end;gap:7px;padding:7px 12px 8px;
  border-radius:24px;
  background:var(--dock-bg);
  backdrop-filter:blur(22px) saturate(215%) brightness(1.08);
  -webkit-backdrop-filter:blur(22px) saturate(215%) brightness(1.08);
  border:1px solid var(--dock-border);
  box-shadow:
    0 22px 54px rgba(0,0,0,.44),
    0 4px 14px rgba(0,0,0,.22),
    inset 0 1.5px 1px rgba(255,255,255,.68),
    inset 0 -1.5px 2px rgba(255,255,255,.22),
    inset 0 0 22px rgba(255,255,255,.08);
  height:68px;
}
#dock::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(105deg,rgba(140,220,255,.16) 0%,rgba(255,255,255,.26) 24%,transparent 52%,rgba(235,170,255,.15) 85%,rgba(255,255,255,.22) 100%);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask-composite:exclude;-webkit-mask-composite:xor;
  padding:1px;opacity:.85;
}
#dock::after{
  content:"";position:absolute;left:14px;right:14px;top:2px;height:14px;border-radius:99px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0));
}
.dock-item{
  position:relative;width:50px;height:50px;border:0;padding:0;background:transparent;
  display:flex;align-items:center;justify-content:center;
  transform-origin:bottom center;will-change:transform,width,height;
  transition:transform .16s cubic-bezier(.22,1,.36,1),width .16s cubic-bezier(.22,1,.36,1),height .16s cubic-bezier(.22,1,.36,1);
  cursor:pointer;
}
.dock-item.dragging-dock{transition:none}
.dock-item svg{width:100%;height:100%;filter:drop-shadow(0 5px 10px rgba(0,0,0,.35));pointer-events:none}
.dock-item .dock-tip{
  position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);
  padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;
  background:var(--popover-bg);color:var(--text);
  border:1px solid var(--border-inner);box-shadow:0 6px 18px rgba(0,0,0,.28);
  backdrop-filter:blur(24px);opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;
}
.dock-item:hover .dock-tip{opacity:1;transform:translateX(-50%) translateY(0)}
.dock-item.running::after{
  content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--text);opacity:.88;
}
.dock-sep{width:1px;height:38px;margin:0 4px 6px;flex:none;background:rgba(255,255,255,.25)}
.dock-bounce{animation:dockBounce .55s cubic-bezier(.28,.84,.42,1)}
@keyframes dockBounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}70%{transform:translateY(-5px)}}

/* ========== WINDOWS ========== */
#windows{position:absolute;inset:0;pointer-events:none;z-index:20}
.window{
  position:absolute;pointer-events:auto;
  min-width:300px;min-height:200px;
  border-radius:16px;
  background:var(--win-bg);
  backdrop-filter:blur(32px) saturate(210%) brightness(1.04);-webkit-backdrop-filter:blur(32px) saturate(210%) brightness(1.04);
  box-shadow:var(--shadow-inactive),inset 0 1px 1px rgba(255,255,255,.42),inset 0 0 0 1px var(--border-inner),0 0 0 .5px var(--border-outer);
  overflow:hidden;display:flex;flex-direction:column;
  transform-origin:center center;
  transition:box-shadow .22s ease;
  will-change:transform,opacity;
}
.window.animating-geom{
  transition:left .32s cubic-bezier(.22,1,.36,1),top .32s cubic-bezier(.22,1,.36,1),width .32s cubic-bezier(.22,1,.36,1),height .32s cubic-bezier(.22,1,.36,1),border-radius .32s cubic-bezier(.22,1,.36,1),box-shadow .22s ease;
}
body.win-dragging .window{transition:none!important}
.window.active-win{
  box-shadow:var(--shadow-active),inset 0 1px 1.5px rgba(255,255,255,.52),inset 0 0 0 1px var(--border-inner),0 0 0 .5px var(--border-outer);
}
.window.minimized{
  visibility:hidden;
  opacity:0;
  pointer-events:none;
}
.window.maximized{
  left:0!important;top:var(--menubar-h)!important;
  width:100vw!important;height:calc(100vh - var(--menubar-h) - 82px)!important;
  border-radius:10px;
}

/* Traffic Lights */
.traffic{display:flex;align-items:center;gap:8px;z-index:5;flex:none}
.tl-btn{
  width:12px;height:12px;border-radius:50%;border:0;padding:0;
  display:grid;place-items:center;position:relative;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.22);transition:filter .12s,background .15s;
}
.tl-btn svg{opacity:0;transition:opacity .1s;width:8px;height:8px;color:rgba(0,0,0,.68)}
.traffic:hover .tl-btn svg{opacity:1}
.tl-close{background:#ff5f57}
.tl-min{background:#febc2e}
.tl-zoom{background:#28c840}
.window:not(.active-win) .tl-btn{background:rgba(128,128,128,.35);box-shadow:none}
.window:not(.active-win) .traffic:hover .tl-close{background:#ff5f57}
.window:not(.active-win) .traffic:hover .tl-min{background:#febc2e}
.window:not(.active-win) .traffic:hover .tl-zoom{background:#28c840}

/* Standard Titlebar */
.titlebar{
  height:38px;flex:none;display:flex;align-items:center;padding:0 14px;position:relative;
  border-bottom:1px solid var(--hairline);background:var(--toolbar-bg);cursor:default;
}
.titlebar-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:13px;font-weight:600;color:var(--text);pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;
}
.window:not(.active-win) .titlebar-title{color:var(--text-2)}
.win-body{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--win-body);overflow:hidden;position:relative}
body.win-dragging iframe{pointer-events:none!important}

/* Game App Shell (Saltline / DustBlock CS) */
.game-shell{display:flex;flex-direction:column;width:100%;height:100%;min-height:0;background:#090b10}
.game-toolbar{
  height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;
  border-bottom:1px solid var(--hairline);background:var(--toolbar-bg);font-size:12px;color:var(--text-2);
}
.game-hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.game-pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(10,132,255,.16);color:#60a5fa;border:1px solid rgba(10,132,255,.28)}
.game-actions{display:flex;align-items:center;gap:6px;flex:none}
.game-frame-wrap{flex:1;min-height:0;position:relative;background:#07090d}
.game-frame{width:100%;height:100%;border:0;display:block;background:#07090d}

/* Unified Sidebar Layout (Finder / Notes / Settings) */
.unified-shell{display:grid;grid-template-columns:196px 1fr;height:100%;width:100%}
.unified-sidebar{
  background:var(--sidebar-bg);border-right:1px solid var(--hairline);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-top{height:44px;display:flex;align-items:center;padding:0 14px;flex:none}
.sidebar-scroll{flex:1;overflow:auto;padding:4px 10px 14px}
.side-group-title{font-size:11px;font-weight:600;color:var(--text-3);padding:10px 10px 4px;letter-spacing:.2px}
.side-item{
  width:100%;border:0;background:transparent;border-radius:7px;padding:6px 10px;
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);text-align:left;
}
.side-item:hover{background:var(--card-hover)}
.side-item.active{background:rgba(128,128,128,.22);font-weight:500}
.side-dot{width:10px;height:10px;border-radius:50%;flex:none}
.unified-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--win-body)}
.unified-toolbar{
  height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;
  border-bottom:1px solid var(--hairline);background:var(--toolbar-bg);
}

/* Resize Handle */
.resizer{position:absolute;z-index:10}
.resizer-br{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
.resizer-r{right:0;top:38px;bottom:14px;width:5px;cursor:ew-resize}
.resizer-b{left:14px;right:14px;bottom:0;height:5px;cursor:ns-resize}

/* ========== SHARED UI COMPONENTS ========== */
.scroll-pane{flex:1;overflow:auto;padding:20px}
.btn-mac{
  border:1px solid var(--hairline);background:var(--card-bg);border-radius:7px;
  padding:5px 12px;font-size:12.5px;font-weight:500;cursor:pointer;
  transition:background .12s;display:inline-flex;align-items:center;gap:6px;
}
.btn-mac:hover{background:var(--card-hover)}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn-icon{
  width:28px;height:26px;border-radius:6px;border:0;background:transparent;
  display:grid;place-items:center;color:var(--text-2);cursor:pointer;
}
.btn-icon:hover{background:var(--card-hover);color:var(--text)}
.btn-icon.active{background:var(--card-hover);color:var(--text)}
.mac-input{
  border:1px solid var(--hairline);background:var(--input-bg);border-radius:7px;
  padding:6px 10px;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.mac-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tag-pill{
  display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;
  font-size:11px;font-weight:500;background:var(--accent-soft);color:var(--accent);
}

/* ========== APP: FINDER ========== */
.finder-grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:14px;align-content:start;flex:1;overflow:auto}
.finder-file{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:9px;
  cursor:default;text-align:center;border:1px solid transparent;
}
.finder-file:hover{background:var(--card-bg)}
.finder-file.selected{background:var(--accent-soft);border-color:var(--accent-ring)}
.finder-file .fname{font-size:12px;line-height:1.3;word-break:break-word}
.finder-list{flex:1;overflow:auto;display:flex;flex-direction:column}
.finder-row{
  display:grid;grid-template-columns:1fr 110px 80px;padding:7px 16px;font-size:12.5px;
  border-bottom:1px solid var(--hairline);align-items:center;cursor:default;
}
.finder-row:hover{background:var(--card-bg)}
.finder-row.selected{background:var(--accent);color:#fff}
.finder-status{height:24px;border-top:1px solid var(--hairline);padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-3);background:var(--toolbar-bg)}

/* ========== APP: SAFARI ========== */
.safari-top{background:var(--toolbar-bg);border-bottom:1px solid var(--hairline);padding:8px 14px;display:flex;align-items:center;gap:12px}
.safari-url{
  flex:1;max-width:460px;margin:0 auto;height:28px;border-radius:8px;
  background:var(--input-bg);border:1px solid var(--hairline);
  display:flex;align-items:center;padding:0 10px;gap:6px;
}
.safari-url input{flex:1;border:0;background:transparent;outline:none;font-size:12.5px;text-align:center}
.safari-url input:focus{text-align:left}
.safari-tabs{display:flex;background:var(--sidebar-bg);border-bottom:1px solid var(--hairline);padding:4px 8px 0;gap:4px}
.safari-tab{
  flex:1;max-width:200px;height:28px;border-radius:7px 7px 0 0;padding:0 10px;
  display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-2);
  cursor:pointer;background:transparent;border:0;
}
.safari-tab.active{background:var(--win-body);color:var(--text);font-weight:500}

/* ========== APP: CALCULATOR ========== */
.calc-wrap{height:100%;display:flex;flex-direction:column;background:#1c1c1e;color:#fff;padding:12px 14px 16px}
.calc-display{
  flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;
  padding:8px 6px 12px;min-height:76px;
}
.calc-expr{font-size:14px;color:rgba(255,255,255,.45);min-height:18px;font-variant-numeric:tabular-nums}
.calc-num{font-size:48px;font-weight:300;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc-btn{
  height:52px;border-radius:99px;border:0;font-size:21px;font-weight:400;
  display:grid;place-items:center;cursor:pointer;transition:filter .1s,transform .06s;
}
.calc-btn:active{transform:scale(.95);filter:brightness(1.2)}
.calc-fn{background:#a5a5a5;color:#000;font-size:18px;font-weight:500}
.calc-op{background:#ff9f0a;color:#fff;font-size:24px}
.calc-op.active-op{background:#fff;color:#ff9f0a}
.calc-digit{background:#333336;color:#fff}
.calc-zero{grid-column:span 2;justify-content:start;padding-left:22px}

/* ========== APP: CALENDAR ========== */
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--hairline)}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--hairline);background:var(--toolbar-bg)}
.cal-weekdays div{text-align:right;padding:6px 10px;font-size:11.5px;font-weight:600;color:var(--text-2)}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr}
.cal-cell{
  border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  padding:6px 8px;display:flex;flex-direction:column;gap:4px;min-height:58px;
}
.cal-cell:nth-child(7n){border-right:0}
.cal-day-num{align-self:flex-end;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500}
.cal-cell.other-month .cal-day-num{color:var(--text-3)}
.cal-cell.today .cal-day-num{background:#ff3b30;color:#fff;font-weight:700}
.cal-event{font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ========== APP: TERMINAL ========== */
.term-body{
  flex:1;background:rgba(12,14,18,.92);color:#e4ece6;padding:14px 16px;
  font-family:var(--mono);font-size:12.5px;line-height:1.6;overflow:auto;user-select:text;
}
.term-line{white-space:pre-wrap;word-break:break-word}
.term-prompt{display:flex;align-items:center;gap:6px;margin-top:2px}
.term-prompt span{color:#30d158;font-weight:600;white-space:nowrap}
.term-prompt input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-family:var(--mono);font-size:12.5px}

/* ========== APP: NOTES ========== */
.notes-list-item{padding:10px 12px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--hairline)}
.notes-list-item.active{background:var(--accent);color:#fff}
.notes-list-item.active .notes-meta{color:rgba(255,255,255,.8)}
.notes-meta{font-size:11px;color:var(--text-3);margin-top:3px}
.notes-editor{flex:1;border:0;background:transparent;outline:none;resize:none;padding:18px 26px;font-size:14px;line-height:1.75;user-select:text}

/* ========== APP: MUSIC (JAY CHOU + LIQUID GLASS LYRICS) ========== */
.music-shell{
  display:grid;grid-template-columns:285px 1fr;height:100%;width:100%;
  background:radial-gradient(circle at 18% 22%,rgba(250,45,72,.22),transparent 55%),radial-gradient(circle at 85% 80%,rgba(255,159,10,.14),transparent 52%);
}
.music-left{
  padding:20px;border-right:1px solid var(--hairline);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(255,255,255,.03);
}
.music-cover{
  width:196px;height:196px;border-radius:18px;overflow:hidden;position:relative;
  box-shadow:0 22px 48px rgba(0,0,0,.46),inset 0 1px 1px rgba(255,255,255,.4);
  transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease;
}
.music-cover.playing{transform:scale(1.035);box-shadow:0 28px 60px rgba(250,45,72,.35),inset 0 1px 1px rgba(255,255,255,.45)}
.music-eq{position:absolute;bottom:10px;right:10px;display:flex;align-items:flex-end;gap:3px;height:18px;padding:4px 6px;border-radius:8px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.eq-bar{width:3px;border-radius:2px;background:#fff;height:4px;transition:height .14s}
.music-scrubber{width:100%;display:flex;flex-direction:column;gap:4px}
.music-range{
  -webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;
  background:rgba(128,128,128,.35);outline:none;cursor:pointer;
}
.music-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
.music-ctrl-row{display:flex;align-items:center;justify-content:center;gap:14px}
.music-play-circle{
  width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(180deg,#ff4d6d,#fa233b);color:#fff;
  display:grid;place-items:center;font-size:17px;cursor:pointer;
  box-shadow:0 8px 22px rgba(250,35,59,.42),inset 0 1px 1px rgba(255,255,255,.45);
  transition:transform .12s;
}
.music-play-circle:hover{transform:scale(1.06)}
.music-right{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.music-lyrics{
  flex:1;overflow:auto;padding:36px 26px 90px;display:flex;flex-direction:column;gap:14px;
  scroll-behavior:smooth;mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 84%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 12%,#000 84%,transparent 100%);
}
.lrc-line{
  font-size:17px;font-weight:600;line-height:1.45;color:var(--text);opacity:.32;
  filter:blur(.55px);transform-origin:left center;cursor:pointer;
  transition:opacity .28s,transform .28s,filter .28s,color .28s;
}
.lrc-line:hover{opacity:.75;filter:none}
.lrc-line.active{
  opacity:1;filter:none;font-size:21px;font-weight:700;transform:scale(1.02);
  text-shadow:0 2px 18px rgba(255,255,255,.22);
}
.music-track-tabs{
  display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--hairline);overflow-x:auto;flex:none;
}
.music-tab{
  padding:4px 10px;border-radius:99px;border:1px solid var(--hairline);background:var(--card-bg);
  font-size:11.5px;white-space:nowrap;cursor:pointer;
}
.music-tab.active{background:var(--accent);color:#fff;border-color:transparent}
@media(max-width:720px){.music-shell{grid-template-columns:1fr;overflow:auto}.music-left{border-right:0;border-bottom:1px solid var(--hairline)}}

/* ========== SPOTLIGHT ========== */
#spotlight-backdrop{
  position:fixed;inset:0;z-index:40000;display:flex;align-items:flex-start;justify-content:center;
  padding-top:17vh;background:rgba(0,0,0,.18);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease,visibility .2s ease;
}
#spotlight-backdrop.show{opacity:1;visibility:visible;pointer-events:auto}
#spotlight{
  width:min(620px,calc(100vw - 28px));border-radius:16px;
  background:var(--popover-bg);
  backdrop-filter:blur(48px) saturate(200%);-webkit-backdrop-filter:blur(48px) saturate(200%);
  border:1px solid var(--border-inner);
  box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 .5px var(--border-outer);
  overflow:hidden;
  transform:scale(.96) translateY(-10px);
  transition:transform .24s cubic-bezier(.22,1,.36,1);
}
#spotlight-backdrop.show #spotlight{transform:scale(1) translateY(0)}
.spot-input-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--hairline)}
.spot-input-row input{flex:1;border:0;background:transparent;outline:none;font-size:19px;font-weight:400}
.spot-results{max-height:320px;overflow:auto;padding:8px}
.spot-item{
  display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:9px;cursor:pointer;
}
.spot-item.active,.spot-item:hover{background:var(--accent);color:#fff}
.spot-item.active .spot-sub,.spot-item:hover .spot-sub{color:rgba(255,255,255,.8)}
.spot-sub{font-size:11.5px;color:var(--text-2);margin-left:auto}

/* ========== LAUNCHPAD ========== */
#launchpad{
  position:fixed;inset:0;z-index:35000;display:flex;flex-direction:column;align-items:center;
  padding:54px 24px 100px;background:rgba(12,14,22,.48);
  backdrop-filter:blur(46px) saturate(160%);-webkit-backdrop-filter:blur(46px) saturate(160%);
  overflow:auto;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.05);
  transition:opacity .28s cubic-bezier(.22,1,.36,1),transform .32s cubic-bezier(.22,1,.36,1),visibility .28s;
}
#launchpad.show{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1)}
.lp-search{
  width:240px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12);color:#fff;padding:0 12px;text-align:center;outline:none;margin-bottom:36px;
}
.lp-search::placeholder{color:rgba(255,255,255,.65)}
.lp-grid{
  width:min(820px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:28px 18px;justify-items:center;
}
.lp-app{
  border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;color:#fff;transition:transform .16s cubic-bezier(.22,1,.36,1);
}
.lp-app:hover{transform:scale(1.08)}
.lp-app span{font-size:12.5px;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* ========== LOCK SCREEN ========== */
#lockscreen{
  position:fixed;inset:0;z-index:60000;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;padding:74px 20px 40px;
  background:radial-gradient(circle at 50% 35%,rgba(16,24,42,.18),rgba(6,8,16,.44));
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  color:#fff;
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.05);
  transition:opacity .46s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1),visibility .46s;
}
#lockscreen.show{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1)}
.lock-clock{text-align:center;transition:transform .56s cubic-bezier(.22,1,.36,1),opacity .45s ease;transform:translateY(-22px);opacity:0}
#lockscreen.show .lock-clock{transform:translateY(0);opacity:1}
.lock-date{font-size:21px;font-weight:500;opacity:.92;margin-bottom:4px;text-shadow:0 2px 14px rgba(0,0,0,.38)}
.lock-time{font-size:clamp(68px,11.5vw,104px);font-weight:700;letter-spacing:-2.5px;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 6px 28px rgba(0,0,0,.35)}
.lock-user{display:flex;flex-direction:column;align-items:center;gap:11px;transition:transform .56s cubic-bezier(.22,1,.36,1),opacity .45s ease;transform:translateY(22px);opacity:0}
#lockscreen.show .lock-user{transform:translateY(0);opacity:1}
#lockscreen.unlocking{opacity:0;transform:scale(1.07);pointer-events:none}
.lock-avatar{
  width:76px;height:76px;border-radius:50%;
  background:linear-gradient(135deg,#0a84ff,#bf5af2);
  display:grid;place-items:center;font-size:30px;font-weight:700;
  box-shadow:0 12px 34px rgba(0,0,0,.42),inset 0 1px 1.5px rgba(255,255,255,.5);
}
.lock-pass-wrap{display:flex;align-items:center;gap:6px}
.lock-pass-wrap.shake{animation:lockShake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes lockShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock-pass{
  width:196px;height:33px;border-radius:99px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.2);backdrop-filter:blur(16px);color:#fff;padding:0 14px;outline:none;font-size:13px;
  transition:border-color .15s,background .15s;
}
.lock-pass:focus{border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.26)}
.lock-pass.err{border-color:#ff6961;background:rgba(255,59,48,.22)}
.lock-pass::placeholder{color:rgba(255,255,255,.72)}
.lock-go{
  width:33px;height:33px;border-radius:50%;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.24);
  color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .15s;
}
.lock-go:hover{background:rgba(255,255,255,.38);transform:scale(1.06)}
.lock-unlock-pill{
  border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.2);backdrop-filter:blur(18px);
  color:#fff;padding:7px 20px;border-radius:99px;font-size:13px;font-weight:500;cursor:pointer;
  transition:background .15s,transform .14s;
}
.lock-unlock-pill:hover{background:rgba(255,255,255,.32);transform:scale(1.04)}
.lock-power-row{display:flex;gap:22px;margin-top:6px;opacity:.82}
.lock-power-btn{
  border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:11px;cursor:pointer;opacity:.75;transition:opacity .15s,transform .15s;
}
.lock-power-btn:hover{opacity:1;transform:translateY(-1px)}
.lock-power-circle{
  width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);
  display:grid;place-items:center;font-size:14px;
}
#sleepscreen{
  position:fixed;inset:0;z-index:95000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:rgba(255,255,255,.45);font-size:13px;cursor:pointer;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility .5s ease;
}
#sleepscreen.show{opacity:1;visibility:visible;pointer-events:auto}

/* ========== TOAST ========== */
#toast{
  position:fixed;top:40px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:70000;
  padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:500;
  background:var(--popover-bg);border:1px solid var(--border-inner);
  box-shadow:0 12px 32px rgba(0,0,0,.35);backdrop-filter:blur(30px);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== RESPONSIVE ========== */
@media(max-width:1080px){
  #dock{gap:5px;padding:6px 10px}
  .dock-item{width:44px;height:44px}
}
@media(max-width:720px){
  .mb-hide-sm{display:none!important}
  .unified-shell{grid-template-columns:1fr}
  .unified-sidebar{display:none}
  .window{left:6px!important;top:34px!important;width:calc(100vw - 12px)!important;height:calc(100vh - 110px)!important}
  #dock{gap:4px;padding:5px 7px;height:56px;max-width:calc(100vw - 12px);overflow-x:auto}
  .dock-item{width:42px;height:42px}
}

let _iconUid = 0;
function makeGearPath(cx, cy, rOuter, rInner, teeth){
  let d = '';
  const step = (Math.PI * 2) / teeth;
  for(let i = 0; i < teeth; i++){
    const a0 = i * step;
    const a1 = a0 + step * 0.18;
    const a2 = a0 + step * 0.34;
    const a3 = a0 + step * 0.66;
    const a4 = a0 + step * 0.82;
    const pts = [
      [cx + Math.cos(a0)*rInner, cy + Math.sin(a0)*rInner],
      [cx + Math.cos(a1)*rInner, cy + Math.sin(a1)*rInner],
      [cx + Math.cos(a2)*rOuter, cy + Math.sin(a2)*rOuter],
      [cx + Math.cos(a3)*rOuter, cy + Math.sin(a3)*rOuter],
      [cx + Math.cos(a4)*rInner, cy + Math.sin(a4)*rInner]
    ];
    pts.forEach((p, idx)=>{ d += (i===0 && idx===0 ? 'M' : 'L') + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + ' '; });
  }
  return d + 'Z';
}
function makeSafariTicks(){
  let s = '';
  for(let i=0;i<60;i++){
    const a = (i * 6) * Math.PI / 180;
    const major = i % 5 === 0;
    const r1 = major ? 18.2 : 19.6;
    const r2 = 21.6;

}

/* ===================== BOOT & CLOCK ===================== */
function finishBoot(){
  if(STATE.passcode || STATE.bootToLock){
    lockScreen(true);
  }
  document.getElementById('boot').classList.add('done');
}
function rebootSystem(){
  closeAllMenus();
  const ls = document.getElementById('lockscreen');
  ls.classList.remove('show','unlocking');
  document.body.classList.remove('is-locked');
  const boot = document.getElementById('boot');
  const fill = document.getElementById('boot-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  boot.classList.remove('done');
  void fill.offsetWidth;
  fill.style.transition = 'width 1.15s cubic-bezier(.22,1,.36,1)';
  setTimeout(()=>{ fill.style.width = '100%'; }, 60);
  setTimeout(finishBoot, 1250);
}
window.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{document.getElementById('boot-fill').style.width='100%'},60);
  setTimeout(finishBoot,1150);
});

function updateClocks(){
  const d = new Date();
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const fullWeek = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('mb-clock').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${weekdays[d.getDay()]} ${hh}:${mm}`;
  document.getElementById('lock-time').textContent = `${hh}:${mm}`;
  document.getElementById('lock-date').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${fullWeek[d.getDay()]}`;
  document.getElementById('notif-weekday').textContent = fullWeek[d.getDay()];

// Desktop rubber-band selection
(function initDesktopSelect(){
  const desktop = document.getElementById('desktop');
  const box = document.getElementById('selection-box');
  let dragging = false, sx=0, sy=0;
  desktop.addEventListener('mousedown', e=>{
    if(e.button!==0 || e.target.closest('.window,.desk-item,#dock,#menubar,.mac-menu,#control-center,#notif-center')) return;
    document.querySelectorAll('.desk-item').forEach(d=>d.classList.remove('selected'));
    dragging = true; sx = e.clientX; sy = e.clientY;
    box.style.left = sx+'px'; box.style.top = sy+'px'; box.style.width='0px'; box.style.height='0px';
    box.style.display = 'block';
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const x = Math.min(sx,e.clientX), y = Math.min(sy,e.clientY);
    const w = Math.abs(e.clientX-sx), h = Math.abs(e.clientY-sy);
    box.style.left=x+'px'; box.style.top=y+'px'; box.style.width=w+'px'; box.style.height=h+'px';
    const br = box.getBoundingClientRect();
    document.querySelectorAll('.desk-item').forEach(di=>{
      const r = di.getBoundingClientRect();
      const hit = !(r.right<br.left || r.left>br.right || r.bottom<br.top || r.top>br.bottom);
      di.classList.toggle('selected', hit);
    });
  });
  window.addEventListener('mouseup', ()=>{if(dragging){dragging=false;box.style.display='none'}});
})();

function buildDock(){
  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  const dockApps = APPS.filter(a=>a.dock);
  dockApps.forEach(app=>{
    const b = document.createElement('button');
    b.className = 'dock-item';
    b.dataset.app = app.id;
    b.innerHTML = `${getAppIconSVG(app.id, 48)}<span class="dock-tip">${app.name}</span>`;
    b.onclick = ()=>dockAppClick(app.id);
    dock.appendChild(b);
  });

  const sep = document.createElement('div'); sep.className='dock-sep'; dock.appendChild(sep);

  const lp = document.createElement('button');
  lp.className='dock-item';
  lp.innerHTML = `${getAppIconSVG('launchpad', 48)}<span class="dock-tip">启动台</span>`;
  lp.onclick = ()=>toggleLaunchpad();
  dock.appendChild(lp);

  const tr = document.createElement('button');
  tr.className='dock-item';
  tr.innerHTML = `${getAppIconSVG('trash', 48)}<span class="dock-tip">废纸篓</span>`;
  tr.onclick = ()=>{STATE.finderFolder='trash';openApp('finder');renderFinder()};
  dock.appendChild(tr);

  // Magnification physics
  dock.addEventListener('mousemove', e=>{
    if(!STATE.dockMag || window.innerWidth <= 720) return;
    const items = dock.querySelectorAll('.dock-item');
    items.forEach(item=>{
      item.classList.add('dragging-dock');
      const rect = item.getBoundingClientRect();
      const center = rect.left + rect.width/2;
      const dist = Math.abs(e.clientX - center);
      const scale = 1 + 0.48 * Math.exp(-(dist*dist)/(2*62*62));
      const size = 50 * scale;
      item.style.width = size + 'px';
      item.style.height = size + 'px';
      item.style.transform = `translateY(${-(scale-1)*12}px)`;
    });
  });
  dock.addEventListener('mouseleave', ()=>{
    dock.querySelectorAll('.dock-item').forEach(item=>{
      item.classList.remove('dragging-dock');
      item.style.width = ''; item.style.height = ''; item.style.transform = '';
    });
  });
}

function updateDockDots(){

    btn.classList.toggle('running', !!STATE.windows[btn.dataset.app]);

}

function trafficHTML(id){
  return `<div class="traffic">
    <button class="tl-btn tl-close" onclick="closeWin('${id}',event)" title="关闭">
      <svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3L9 9M9 3L3 9"/></svg>
    </button>
    <button class="tl-btn tl-min" onclick="minWin('${id}',event)" title="最小化">
      <svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 6H9.5"/></svg>
    </button>
    <button class="tl-btn tl-zoom" onclick="zoomWin('${id}',event)" title="缩放">
      <svg viewBox="0 0 12 12" fill="currentColor"><path d="M3 3H7L3 7ZM9 9H5L9 5Z"/></svg>
    </button>
  </div>`;
}

function getDockOriginOffset(win, id){
  const dockBtn = document.querySelector(`.dock-item[data-app="${id}"]`);
  const wr = win.getBoundingClientRect();
  let winCx, winCy;
  if(wr.width > 10 && wr.height > 10 && !win.classList.contains('minimized')){
    winCx = wr.left + wr.width / 2;
    winCy = wr.top + wr.height / 2;
  } else if(win.classList.contains('maximized')){
    winCx = window.innerWidth / 2;
    winCy = 28 + (window.innerHeight - 110) / 2;
  } else {
    const left = parseFloat(win.style.left) || 0;
    const top = parseFloat(win.style.top) || 0;
    const w = parseFloat(win.style.width) || 640;
    const h = parseFloat(win.style.height) || 440;
    winCx = left + w / 2;
    winCy = top + h / 2;
  }
  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight - 40;
  if(dockBtn){
    const r = dockBtn.getBoundingClientRect();
    targetX = r.left + r.width / 2;
    targetY = r.top + r.height / 2;
  }
  return { dx: Math.round(targetX - winCx), dy: Math.round(targetY - winCy), dockBtn };
}

function bounceDockIcon(id){
  const dockBtn = document.querySelector(`.dock-item[data-app="${id}"]`);
  if(!dockBtn) return;
  dockBtn.classList.remove('dock-bounce');
  void dockBtn.offsetWidth;
  dockBtn.classList.add('dock-bounce');
  clearTimeout(dockBtn._bt);
  dockBtn._bt = setTimeout(()=>dockBtn.classList.remove('dock-bounce'), 560);
}

function animateWindowDock(w, id, dir, onDone){
  if(w._dockAnim){
    w._dockAnimCancelled = true;
    try{ w._dockAnim.cancel(); }catch(e){}
    w._dockAnim = null;
  }
  w._dockAnimCancelled = false;
  if(!w.animate){ if(onDone) onDone(); return; }
  const { dx, dy } = getDockOriginOffset(w, id);
  if(dir === 'open'){
    w._dockAnim = w.animate([
      { transform:`translate3d(${dx}px,${dy}px,0) scale(0.06,0.10)`, opacity:0.12 },
      { transform:`translate3d(${Math.round(dx*0.26)}px,${Math.round(dy*0.20)}px,0) scale(0.68,0.76)`, opacity:0.96, offset:0.36 },
      { transform:'translate3d(0,0,0) scale(1.014)', opacity:1, offset:0.78 },
      { transform:'translate3d(0,0,0) scale(1)', opacity:1 }
    ], { duration:430, easing:'cubic-bezier(0.18,1.0,0.28,1)' });
    w._dockAnim.onfinish = ()=>{ w._dockAnim = null; if(onDone) onDone(); };
  } else {
    w._dockAnim = w.animate([
      { transform:'translate3d(0,0,0) scale(1)', opacity:1 },
      { transform:`translate3d(${Math.round(dx*0.32)}px,${Math.round(dy*0.26)}px,0) scale(0.62,0.72)`, opacity:0.94, offset:0.38 },
      { transform:`translate3d(${dx}px,${dy}px,0) scale(0.06,0.10)`, opacity:0.04 }
    ], { duration:360, easing:'cubic-bezier(0.32,0.04,0.25,1)', fill:'forwards' });
    w._dockAnim.onfinish = ()=>{
      const cancelled = w._dockAnimCancelled;
      try{ w._dockAnim?.cancel(); }catch(e){}
      w._dockAnim = null;
      if(!cancelled && onDone) onDone();
    };
  }
}

function dockAppClick(id){
  const w = STATE.windows[id];
  if(!w){
    openApp(id);
    return;
  }
  if(w.classList.contains('minimized')){
    openApp(id);
    return;
  }
  if(STATE.activeApp === id){
    minWin(id);
  } else {
    focusWin(id);
  }
}

function openApp(id){
  toggleLaunchpad(false);
  closeAllMenus();
  const app = APPS.find(a=>a.id===id);
  if(!app) return;

  if(STATE.windows[id]){
    const w = STATE.windows[id];
    const wasMin = w.classList.contains('minimized') || !!w._dockAnim;
    w.classList.remove('minimized','closing');
    focusWin(id);
    if(wasMin){
      bounceDockIcon(id);
      animateWindowDock(w, id, 'open');
    }
    return;
  }

  bounceDockIcon(id);

  const win = document.createElement('section');
  win.className = 'window';
  win.id = 'win-' + id;
  const maxW = Math.min(app.w, window.innerWidth - 24);
  const maxH = Math.min(app.h, window.innerHeight - 116);
  const offset = (STATE.winOffset % 5) * 24;
  STATE.winOffset++;
  const left = Math.max(12, Math.round((window.innerWidth - maxW)/2 + offset - 40));
  const top = Math.max(36, Math.round((window.innerHeight - maxH)/2 - 20 + offset - 20));
  win.style.width = maxW + 'px';
  win.style.height = maxH + 'px';
  win.style.left = left + 'px';
  win.style.top = top + 'px';

  const unifiedApps = ['finder','notes','settings'];
  if(unifiedApps.includes(id)){
    win.innerHTML = `<div class="win-body">${renderAppContent(id)}</div>`;
  } else {
    win.innerHTML = `
      <div class="titlebar" data-drag-handle>
        ${trafficHTML(id)}
        <div class="titlebar-title">${app.title}</div>
      </div>
      <div class="win-body">${renderAppContent(id)}</div>`;
  }

  if(!app.noResize){
    win.innerHTML += `<div class="resizer resizer-r"></div><div class="resizer resizer-b"></div><div class="resizer resizer-br"></div>`;
  }

  document.getElementById('windows').appendChild(win);
  STATE.windows[id] = win;
  wireWindowPhysics(win, id, app.noResize);
  initAppRuntime(id, win);
  focusWin(id);
  updateDockDots();
  animateWindowDock(win, id, 'open');
}

function focusTopVisible(excludeId){
  const visible = Object.keys(STATE.windows).filter(k => k!==excludeId && !STATE.windows[k].classList.contains('minimized'));
  if(visible.length){
    const topId = visible.sort((a,b)=>Number(STATE.windows[b].style.zIndex)-Number(STATE.windows[a].style.zIndex))[0];
    focusWin(topId);
  } else {
    STATE.activeApp = null;
    Object.values(STATE.windows).forEach(w=>w.classList.remove('active-win'));
    document.getElementById('mb-active-app').textContent = '访达';
  }
}

function focusWin(id){
  Object.entries(STATE.windows).forEach(([k,w])=>w.classList.toggle('active-win', k===id));
  const w = STATE.windows[id];
  if(w){
    w.style.zIndex = ++STATE.zIndex;
    STATE.activeApp = id;
    const app = APPS.find(a=>a.id===id);
    document.getElementById('mb-active-app').textContent = app ? app.name : '访达';
  }
}

function closeWin(id, e){
  if(e) e.stopPropagation();
  const w = STATE.windows[id];
  if(!w) return;
  if(w._dockAnim){ w._dockAnimCancelled = true; try{ w._dockAnim.cancel(); }catch(err){} w._dockAnim = null; }
  delete STATE.windows[id];
  updateDockDots();
  focusTopVisible(id);
  w.querySelectorAll('iframe').forEach(fr=>{ try{ fr.src = 'about:blank'; }catch(err){} });
  if(w.animate){
    const anim = w.animate([
      { transform:'scale(1)', opacity:1 },
      { transform:'scale(0.91) translateY(8px)', opacity:0 }
    ], { duration:190, easing:'cubic-bezier(0.4,0,1,1)', fill:'forwards' });
    anim.onfinish = ()=>w.remove();
  } else {
    w.remove();
  }
}

function minWin(id, e){
  if(e) e.stopPropagation();
  const w = STATE.windows[id];
  if(!w || w.classList.contains('minimized')) return;
  focusTopVisible(id);
  animateWindowDock(w, id, 'min', ()=>{
    w.classList.add('minimized');
  });
}

function zoomWin(id, e){
  if(e) e.stopPropagation();
  const w = STATE.windows[id];
  if(w && !APPS.find(a=>a.id===id)?.noResize){
    w.classList.add('animating-geom');
    w.classList.toggle('maximized');
    clearTimeout(w._zt);
    w._zt = setTimeout(()=>w.classList.remove('animating-geom'), 350);
  }
}

window.addEventListener('blur', ()=>{
  setTimeout(()=>{
    const active = document.activeElement;
    if(active && active.tagName === 'IFRAME'){
      const w = active.closest('.window[id^="win-"]');
      if(w) focusWin(w.id.replace(/^win-/, ''));
    }
  }, 0);
});

function wireWindowPhysics(win, id, noResize){
  win.addEventListener('mousedown', ()=>focusWin(id));
  win.querySelectorAll('[data-drag-handle]').forEach(bar=>{
    let dragging=false, sx=0, sy=0, sl=0, st=0;
    const stopDrag = ()=>{ dragging=false; document.body.classList.remove('win-dragging'); };
    bar.addEventListener('pointerdown', e=>{
      if(e.target.closest('button,input,select,.traffic') || win.classList.contains('maximized')) return;
      dragging=true; sx=e.clientX; sy=e.clientY;
      document.body.classList.add('win-dragging');
      const r = win.getBoundingClientRect(); sl=r.left; st=r.top;
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener('pointermove', e=>{
      if(!dragging) return;
      win.style.left = Math.max(-win.offsetWidth+120, Math.min(window.innerWidth-120, sl+e.clientX-sx)) + 'px';
      win.style.top = Math.max(28, Math.min(window.innerHeight-70, st+e.clientY-sy)) + 'px';
    });
    bar.addEventListener('pointerup', stopDrag);
    bar.addEventListener('pointercancel', stopDrag);
    bar.addEventListener('dblclick', e=>{
      if(!e.target.closest('button,input')) zoomWin(id);
    });
  });

  if(noResize) return;
  ['r','b','br'].forEach(dir=>{
    const h = win.querySelector('.resizer-'+dir);
    if(!h) return;
    let rs=false, sw=0, sh=0, rx=0, ry=0;
    const stopRs = ()=>{ rs=false; document.body.classList.remove('win-dragging'); };
    h.addEventListener('pointerdown', e=>{
      if(win.classList.contains('maximized')) return;
      rs=true; sw=win.offsetWidth; sh=win.offsetHeight; rx=e.clientX; ry=e.clientY;
      document.body.classList.add('win-dragging');
      h.setPointerCapture(e.pointerId); e.stopPropagation();
    });
    h.addEventListener('pointermove', e=>{
      if(!rs) return;
      if(dir==='r'||dir==='br') win.style.width = Math.max(320, sw+e.clientX-rx)+'px';
      if(dir==='b'||dir==='br') win.style.height = Math.max(220, sh+e.clientY-ry)+'px';
    });
    h.addEventListener('pointerup', stopRs);
    h.addEventListener('pointercancel', stopRs);
  });
}

function renderGameShell(id, src, hint){
  return `
    <div class="game-shell">
      <div class="game-toolbar">
        <div class="game-hint">
          <span class="game-pill">WebGL 3D</span>
          <span>${hint}</span>
        </div>

          <button class="btn-mac btn-primary" onclick="gameWindowAction('${id}','fullscreen','${src}')">全屏游玩</button>
          <button class="btn-mac" onclick="gameWindowAction('${id}','external','${src}')">新标签打开 ↗</button>
        </div>
      </div>
      <div class="game-frame-wrap" id="game-wrap-${id}">
        <iframe id="game-frame-${id}" class="game-frame" src="${src}" allow="fullscreen; pointer-lock; autoplay" allowfullscreen loading="eager"></iframe>
      </div>
    </div>`;
}

function gameWindowAction(id, action, src){
  const frame = document.getElementById('game-frame-' + id);
  const wrap = document.getElementById('game-wrap-' + id);
  if(action === 'reload' && frame){
    frame.src = src;
    toast('已重新载入游戏');
  } else if(action === 'fullscreen'){
    const target = wrap || frame;
    if(target && target.requestFullscreen){
      target.requestFullscreen().then(()=>{
        try{ frame?.contentWindow?.focus(); }catch(e){}
      }).catch(()=>{
        toast('浏览器拦截了全屏请求，可点击「新标签打开」');
      });
    }
  } else if(action === 'external'){
    window.open(src, '_blank', 'noopener');
  }
}

  if(id==='portfolio') initEarthCanvas(win);
  if(id==='music') initMusicUI(win);
}

/* ===================== FINDER LOGIC ===================== */
function switchFinder(folder){
  STATE.finderFolder = folder;
  renderFinder();
}
function setFinderView(v){
  STATE.finderView = v;
  document.getElementById('fv-grid')?.classList.toggle('active', v==='grid');
  document.getElementById('fv-list')?.classList.toggle('active', v==='list');
  renderFinder();
}
function renderFinder(){
  const body = document.getElementById('finder-body');
  if(!body) return;
  const names = {desktop:'桌面',documents:'文稿',portfolio:'作品集',downloads:'下载',trash:'废纸篓'};
  document.getElementById('finder-title').textContent = names[STATE.finderFolder] || '访达';
  document.querySelectorAll('#win-finder .side-item[data-folder]').forEach(el=>el.classList.toggle('active', el.dataset.folder===STATE.finderFolder));
  const q = (document.getElementById('finder-search')?.value || '').trim().toLowerCase();
  const list = (VFS[STATE.finderFolder] || []).filter(item=>item.name.toLowerCase().includes(q));
  document.getElementById('finder-count').textContent = `${list.length} 个项目`;

  if(STATE.finderView==='grid'){
    body.innerHTML = `<div class="finder-grid">${list.map((it,idx)=>`
      <div class="finder-file" onclick="selectFinderItem(this)" ondblclick="openFinderItem(${idx})">
        ${getAppIconSVG(it.target || 'file', 46)}
        <span class="fname">${it.name}</span>
      </div>`).join('')}</div>`;
  } else {
    body.innerHTML = `<div class="finder-list">
      <div class="finder-row" style="font-weight:600;color:var(--text-3);font-size:11px"><span>名称</span><span>大小</span><span>类型</span></div>
      ${list.map((it,idx)=>`
      <div class="finder-row" onclick="selectFinderItem(this)" ondblclick="openFinderItem(${idx})">
        <span style="display:flex;align-items:center;gap:8px">${getAppIconSVG(it.target||'file',18)} ${it.name}</span>
        <span>${it.size}</span><span>${it.kind==='app'?'应用程序':'文稿'}</span>
      </div>`).join('')}</div>`;
  }
}
function selectFinderItem(el){
  el.parentElement.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
}
function openFinderItem(idx){
  const q = (document.getElementById('finder-search')?.value || '').trim().toLowerCase();
  const list = (VFS[STATE.finderFolder] || []).filter(item=>item.name.toLowerCase().includes(q));
  const it = list[idx];
  if(!it) return;
  if(it.kind==='app') openApp(it.target);
  else openFilePreview(it.name, it.content);
}
function openFilePreview(name, content){
  const existing = document.getElementById('file-preview-modal');
  if(existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'file-preview-modal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:50000;background:rgba(0,0,0,.38);display:grid;place-items:center;padding:20px';
  modal.onclick = e=>{if(e.target===modal)modal.remove()};
  modal.innerHTML = `<div style="width:min(540px,100%);border-radius:14px;background:var(--popover-bg);backdrop-filter:blur(40px);border:1px solid var(--border-inner);box-shadow:var(--shadow-active);overflow:hidden">
    <div style="padding:12px 16px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:center">
      <strong>快速查看 — ${name}</strong>
      <button class="btn-mac" onclick="this.closest('#file-preview-modal').remove()">关闭</button>
    </div>
    <pre style="margin:0;padding:18px;font-family:var(--font);font-size:13.5px;line-height:1.7;white-space:pre-wrap;max-height:60vh;overflow:auto">${content}</pre>
  </div>`;
  document.body.appendChild(modal);
}

/* ===================== CALENDAR LOGIC (7-COLUMN) ===================== */
function renderCalendar(){
  const grid = document.getElementById('cal-grid');
  const title = document.getElementById('cal-title');
  if(!grid || !title) return;
  const y = STATE.calYear, m = STATE.calMonth;
  title.textContent = `${y}年 ${m+1}月`;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const now = new Date();
  let html = '';
  for(let i=firstDay-1;i>=0;i--){
    html += `<div class="cal-cell other-month"><div class="cal-day-num">${prevDays-i}</div></div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const isToday = y===now.getFullYear() && m===now.getMonth() && d===now.getDate();
    const ev = isToday ? '<div class="cal-event">XXUUS OS v2 发布</div>' : (d===20?'<div class="cal-event">创意实验室同步</div>':'');
    html += `<div class="cal-cell ${isToday?'today':''}"><div class="cal-day-num">${d}</div>${ev}</div>`;
  }
  const totalCells = firstDay + daysInMonth;
  const rem = (7 - (totalCells % 7)) % 7;
  for(let i=1;i<=rem;i++){
    html += `<div class="cal-cell other-month"><div class="cal-day-num">${i}</div></div>`;
  }
  grid.innerHTML = html;
}
function shiftCal(delta){
  STATE.calMonth += delta;
  if(STATE.calMonth<0){STATE.calMonth=11;STATE.calYear--}
  if(STATE.calMonth>11){STATE.calMonth=0;STATE.calYear++}
  renderCalendar();
}

/* ===================== CALCULATOR LOGIC ===================== */
function initCalculator(win){
  const grid = win.querySelector('#calc-grid');
  const numEl = win.querySelector('#calc-num');
  const exprEl = win.querySelector('#calc-expr');
  let cur='0', prev=null, op=null, resetNext=false;
  const btns = [
    {t:'AC',c:'calc-fn'},{t:'±',c:'calc-fn'},{t:'%',c:'calc-fn'},{t:'÷',c:'calc-op'},
    {t:'7',c:'calc-digit'},{t:'8',c:'calc-digit'},{t:'9',c:'calc-digit'},{t:'×',c:'calc-op'},
    {t:'4',c:'calc-digit'},{t:'5',c:'calc-digit'},{t:'6',c:'calc-digit'},{t:'−',c:'calc-op'},
    {t:'1',c:'calc-digit'},{t:'2',c:'calc-digit'},{t:'3',c:'calc-digit'},{t:'+',c:'calc-op'},
    {t:'0',c:'calc-digit calc-zero'},{t:'.',c:'calc-digit'},{t:'=',c:'calc-op'}
  ];
  const calc = (a,b,o)=>{
    if(o==='+') return a+b;
    if(o==='−') return a-b;
    if(o==='×') return a*b;
    if(o==='÷') return b===0 ? '错误' : a/b;
    return b;
  };
  const fmt = v => {
    if(v==='错误') return v;
    const n = Number(v);
    if(!Number.isFinite(n)) return '错误';
    return String(Number(n.toPrecision(10)));
  };
  const press = k => {
    if(k==='AC'){cur='0';prev=null;op=null;resetNext=false;exprEl.textContent='';}
    else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):(cur==='0'?'0':'-'+cur);}
    else if(k==='%'){cur=fmt(Number(cur)/100);}
    else if(['+','−','×','÷'].includes(k)){
      if(op && !resetNext && prev!==null){ cur = fmt(calc(Number(prev), Number(cur), op)); }
      prev = cur; op = k; resetNext = true;
      exprEl.textContent = `${prev} ${op}`;
    } else if(k==='='){
      if(op && prev!==null){
        exprEl.textContent = `${prev} ${op} ${cur} =`;
        cur = fmt(calc(Number(prev), Number(cur), op));
        prev = null; op = null; resetNext = true;
      }
    } else {
      if(resetNext){cur = k==='.'?'0.':k; resetNext=false;}
      else if(k==='.'){if(!cur.includes('.')) cur+='.';}
      else cur = cur==='0'?k:cur+k;
    }
    numEl.textContent = cur;
    numEl.style.fontSize = cur.length>8 ? '32px' : '48px';
  };
  grid.innerHTML = '';
  btns.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'calc-btn ' + b.c;
    btn.textContent = b.t;
    btn.onclick = ()=>press(b.t);
    grid.appendChild(btn);
  });
}

function initTerminal(win){
  const input = win.querySelector('#term-in');
  const out = win.querySelector('#term-out');

  const hist = []; let hIdx = 0;
  setTimeout(()=>input.focus(), 50);
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowUp'){if(hIdx>0){hIdx--;input.value=hist[hIdx]}e.preventDefault();return}
    if(e.key==='ArrowDown'){if(hIdx<hist.length-1){hIdx++;input.value=hist[hIdx]}else{hIdx=hist.length;input.value=''}e.preventDefault();return}
    if(e.key!=='Enter') return;
    const raw = input.value.trim();
    if(raw){hist.push(raw); hIdx=hist.length;}
    const cmdLine = document.createElement('div');
    cmdLine.className = 'term-line';

    else if(cmd==='whoami') res = 'xxuus (Offline Web Desktop Administrator)';
    else if(cmd==='date') res = new Date().toLocaleString('zh-CN');

      else res='用法：theme dark 或 theme light';

      if(found){ openApp(found.id); res='正在打开 '+found.name+'...'; }

function parseLRC(raw){
  return raw.split(/\r?\n/).map(line=>{
    const m = line.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if(!m) return null;
    return {t: Number(m[1])*60 + Number(m[2]), text: m[3].trim()};
  }).filter(x=>x && x.text);
}

function startAmbientSynth(tr){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  STATE.musicPlaying = true;
  let step = 0;
  const playNote = ()=>{
    if(!STATE.musicPlaying) return;
    const freq = tr.notes[step % tr.notes.length];
    step++;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.35);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.2);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 2.3);
  };
  playNote();
  synthTimer = setInterval(playNote, 1300);
  startEqAnim();
  syncMusicLabels();
}

function startEqAnim(){
  clearInterval(eqTimer);
  eqTimer = setInterval(()=>{

/* ===================== PORTFOLIO 3D GLOBE CANVAS ===================== */
function initEarthCanvas(win){
  const c = win.querySelector('#earth-canvas');
  if(!c) return;
  const ctx = c.getContext('2d');
  let angle = 0;
  function draw(){
    if(!document.body.contains(c)) return;
    ctx.clearRect(0,0,c.width,c.height);
    const cx=c.width/2, cy=c.height/2, r=64;
    ctx.strokeStyle = 'rgba(56,189,248,0.42)';
    ctx.lineWidth = 1;
    // Outer sphere
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
    // Latitudes
    for(let lat=-60; lat<=60; lat+=30){
      const y = cy + Math.sin(lat*Math.PI/180)*r;
      const rx = Math.cos(lat*Math.PI/180)*r;
      ctx.beginPath(); ctx.ellipse(cx,y,rx,rx*0.22,0,0,Math.PI*2); ctx.stroke();
    }
    // Longitudes
    for(let i=0;i<6;i++){
      const a = angle + i*(Math.PI/6);
      const rx = Math.abs(Math.cos(a))*r;
      ctx.beginPath(); ctx.ellipse(cx,cy,rx,r,0,0,Math.PI*2); ctx.stroke();
    }
    // Orbiting satellite dot
    const sx = cx + Math.cos(angle*1.4)*(r+14);
    const sy = cy + Math.sin(angle*1.4)*(r*0.42);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx,sy,3,0,Math.PI*2); ctx.fill();
    angle += 0.012;
    requestAnimationFrame(draw);
  }
  draw();
}

}

/* Spotlight */
let spotIndex = 0, spotMatches = [];
function openSpotlight(){
  closeAllMenus();
  const bd = document.getElementById('spotlight-backdrop');
  bd.classList.add('show');
  const inp = document.getElementById('spot-input');
  inp.value = '';
  renderSpotlight();
  setTimeout(()=>inp.focus(), 20);
}
function closeSpotlight(){document.getElementById('spotlight-backdrop').classList.remove('show')}
function renderSpotlight(){
  const q = document.getElementById('spot-input').value.trim().toLowerCase();
  const res = document.getElementById('spot-results');
  spotMatches = [];
  // Quick Math
  if(q && /^[0-9+\-*/().\s]+$/.test(q)){
    try{
      const ans = Function('"use strict";return ('+q+')')();
      if(typeof ans==='number' && Number.isFinite(ans)){
        spotMatches.push({title:`= ${ans}`, sub:'计算器结果', icon:'calculator', act:()=>{navigator.clipboard?.writeText(String(ans));toast('已复制计算结果：'+ans)}});
      }
    }catch{}
  }
  APPS.filter(a=>!q || a.name.toLowerCase().includes(q) || a.id.includes(q)).forEach(a=>{
    spotMatches.push({title:a.name, sub:'应用程序', icon:a.id, act:()=>openApp(a.id)});
  });
  if(!q || '深色浅色主题'.includes(q)) spotMatches.push({title:'切换深色 / 浅色外观', sub:'系统操作', icon:'settings', act:()=>toggleTheme()});
  if(!q || '壁纸背景'.includes(q)) spotMatches.push({title:'下一张桌面壁纸', sub:'系统操作', icon:'photos', act:()=>nextWallpaper()});
  if(!q || '锁屏锁定'.includes(q)) spotMatches.push({title:'锁定屏幕', sub:'系统操作', icon:'about', act:()=>lockScreen()});

  spotIndex = 0;
  res.innerHTML = spotMatches.slice(0,8).map((m,i)=>`
    <div class="spot-item ${i===0?'active':''}" onclick="spotMatches[${i}].act();closeSpotlight()">
      ${getAppIconSVG(m.icon, 26)}
      <strong>${m.title}</strong>
      <span class="spot-sub">${m.sub}</span>
    </div>`).join('');
}
function spotKey(e){
  const items = document.querySelectorAll('.spot-item');
  if(e.key==='Escape'){closeSpotlight();return}
  if(e.key==='ArrowDown'){spotIndex=(spotIndex+1)%items.length;items.forEach((x,i)=>x.classList.toggle('active',i===spotIndex));e.preventDefault()}
  if(e.key==='ArrowUp'){spotIndex=(spotIndex-1+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle('active',i===spotIndex));e.preventDefault()}
  if(e.key==='Enter' && spotMatches[spotIndex]){spotMatches[spotIndex].act();closeSpotlight()}
}

/* Lock, Security & Sleep */
function saveSecuritySettings(){
  const u = (document.getElementById('sec-user')?.value || '').trim() || 'XXUUS';
  const p = (document.getElementById('sec-pass')?.value || '');
  const h = (document.getElementById('sec-hint')?.value || '').trim();
  STATE.userName = u;
  STATE.passcode = p;
  STATE.passHint = h;
  localStorage.setItem('xxuus-user', u);
  localStorage.setItem('xxuus-pass', p);
  localStorage.setItem('xxuus-hint', h);
  if(p){ STATE.bootToLock = true; localStorage.setItem('xxuus-bootlock', 'true'); }
  const su = document.getElementById('set-user-name'); if(su) su.textContent = u;
  const sav = document.getElementById('set-user-av'); if(sav) sav.textContent = u[0].toUpperCase();
  updateLockUI();
  toast(p ? '已保存锁屏密码，锁定后需输入密码进入' : '已保存用户信息（无密码模式）');
  renderSettingsTab('security');
}
function clearSecurityPass(){
  STATE.passcode = '';
  STATE.passHint = '';
  localStorage.removeItem('xxuus-pass');
  localStorage.removeItem('xxuus-hint');
  updateLockUI();
  toast('已清除登录密码');
  renderSettingsTab('security');
}
function updateLockUI(){
  const name = STATE.userName || 'XXUUS';
  const av = document.getElementById('lock-avatar');
  const un = document.getElementById('lock-username');
  const pwWrap = document.getElementById('lock-pass-wrap');
  const qBtn = document.getElementById('lock-quick-btn');
  const hintEl = document.getElementById('lock-hint-text');
  const inp = document.getElementById('lock-input');
  if(av) av.textContent = name[0].toUpperCase();
  if(un) un.textContent = name;
  if(STATE.passcode){
    if(pwWrap) pwWrap.style.display = 'flex';
    if(qBtn) qBtn.style.display = 'none';
    if(inp){ inp.placeholder = '输入登录密码'; inp.classList.remove('err'); }
    if(hintEl) hintEl.textContent = '按 Enter 验证密码解锁';
  } else {
    if(pwWrap) pwWrap.style.display = 'none';
    if(qBtn) qBtn.style.display = 'inline-block';
    if(hintEl) hintEl.textContent = '未设置密码（可在系统设置 → 锁屏与密码中设置）';
  }
}
function lockScreen(immediate=false){
  closeAllMenus();
  closeSpotlight();
  toggleLaunchpad(false);
  updateLockUI();
  const ls = document.getElementById('lockscreen');
  ls.classList.remove('unlocking');
  document.body.classList.add('is-locked');
  if(immediate){
    ls.classList.add('show');
  } else {
    requestAnimationFrame(()=>{ ls.classList.add('show'); });
  }
  setTimeout(()=>{
    const inp = document.getElementById('lock-input');
    if(inp && STATE.passcode){ inp.value=''; inp.focus(); }
  }, 240);
}
function unlockScreen(){
  const ls = document.getElementById('lockscreen');
  if(!ls.classList.contains('show')) return;
  const inp = document.getElementById('lock-input');
  const wrap = document.getElementById('lock-pass-wrap');
  const hintEl = document.getElementById('lock-hint-text');
  if(STATE.passcode){
    const entered = inp ? inp.value : '';
    if(entered !== STATE.passcode){
      if(inp){ inp.classList.add('err'); inp.value=''; inp.focus(); }
      if(wrap){ wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake'); }
      if(hintEl) hintEl.textContent = STATE.passHint ? ('密码错误 · 提示：' + STATE.passHint) : '密码错误，请重新输入';
      return;
    }
  }
  const goBtn = document.getElementById('lock-go-btn');
  if(goBtn) goBtn.textContent = '✓';
  ls.classList.add('unlocking');
  ls.classList.remove('show');
  document.body.classList.remove('is-locked');
  if(inp){ inp.value=''; inp.classList.remove('err'); }
  setTimeout(()=>{
    ls.classList.remove('unlocking');
    if(goBtn) goBtn.textContent = '→';
    toast('欢迎回来，' + (STATE.userName || 'XXUUS'));
  }, 420);
}
function sleepScreen(){
  document.getElementById('sleepscreen').classList.add('show');
}
function wakeFromSleep(){
  const s = document.getElementById('sleepscreen');
  if(!s.classList.contains('show')) return;
  s.classList.remove('show');
  setTimeout(()=>{
    const inp = document.getElementById('lock-input');
    if(inp && STATE.passcode) inp.focus();
  }, 200);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(()=>t.classList.remove('show'), 2300);
}

/* Keyboard Shortcuts */
document.addEventListener('keydown', e=>{
  if(document.getElementById('sleepscreen')?.classList.contains('show')){ wakeFromSleep(); return; }
  if(document.getElementById('lockscreen')?.classList.contains('show')){
    if(e.key === 'Enter' && !STATE.passcode) unlockScreen();
    return;
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){e.preventDefault();openSpotlight()}
  if(e.altKey && e.key.toLowerCase()==='l'){e.preventDefault();lockScreen()}
  if(e.key==='Escape'){closeSpotlight();toggleLaunchpad(false);closeAllMenus()}
});

applyThemeAndWallpaper();
buildDesktopIcons();
buildDock();
openApp('finder');
</script>
